name: CPQCTorchkit ETTh1 training MSE compatibility
on:
  push:
    branches:
      - ci/cpqc-etth1-train-mse-20261122

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        kaiwu: ['1.3.1', '1.4.0', '1.4.3']
    env:
      CUDA_VISIBLE_DEVICES: ''
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
        with:
          repository: huier5635-cmd/kaiwu-pytorch-plugin
          ref: 4a37a0b72ed198906e0a0672b0370949e3990aae
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install the CPU build and the pinned SDK dependencies
        env:
          KAIWU_VERSION: ${{ matrix.kaiwu }}
        run: |
          python -m pip install torch==2.7.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --only-binary=:all: \
            numpy==2.2.6 "kaiwu==$KAIWU_VERSION" pytest==8.3.5 \
            pandas scikit-learn==1.7.2 scipy==1.14.1 tqdm==4.67.1
          python -m pip install .
          python -m pip check
      - name: Verify the tested source and installed plugin
        run: |
          test "$(git rev-parse HEAD)" = 4a37a0b72ed198906e0a0672b0370949e3990aae
          test "$(git rev-parse HEAD^)" = cbef8d86b297963326b92eeabd9d32be2a640c21
          python -I -c 'import sys; import kaiwu.torch_plugin as p; assert p.__file__.startswith(sys.prefix), p.__file__'
      - name: Test both corrected training-log cases
        run: python -m pytest -q tests/test_etth1_train_mse.py --tb=short
      - name: Reproduce the wrong MSE on the original trainer
        run: |
          git show HEAD^:example/qdeq/simple/simple_train_example.py > example/qdeq/simple/simple_train_example.py
          set +e
          python -m pytest -q tests/test_etth1_train_mse.py --tb=short > baseline.log 2>&1
          status=$?
          set -e
          cat baseline.log
          test "$status" = 1
          grep -F '1 failed, 1 passed' baseline.log
          grep -F 'train mse 4.5000 | val mse 3.0000' baseline.log
