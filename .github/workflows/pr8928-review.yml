name: PR8928 reviewer-requested adapter validation
on:
  push:
    branches: [ci/pr8928-review-20261023]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          path: payload
      - uses: actions/checkout@v4
        with:
          repository: agentic-os-org/ANOLISA
          ref: 5351c892f2e89d6be799ebdbeea948c173d3d7c2
          path: upstream
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.6'
      - run: python -m pip install 'black==25.1.0'
      - name: Validate compatibility and cancellation negative controls and complete suites
        run: python payload/.ci/pr8928-review/validate.py upstream evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr8928-review-unit
          path: evidence/
  wheel:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: payload
      - uses: actions/checkout@v4
        with:
          repository: agentic-os-org/ANOLISA
          ref: 5351c892f2e89d6be799ebdbeea948c173d3d7c2
          path: upstream
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.6'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: upstream/src/tokenless
      - run: python -m pip install 'maturin>=1.9,<2'
      - name: Build the native SDK from this revision's Rust source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence wheels
          { python --version; rustc --version; cargo --version; maturin --version; git -C upstream rev-parse HEAD; } > evidence/build-environment.txt
          maturin build --locked --profile python-release --manifest-path upstream/src/tokenless/python/tokenless/Cargo.toml --out wheels -i python > evidence/wheel-build.txt 2>&1
          sha256sum wheels/*.whl > evidence/wheel-sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr8928-review-wheel-build
          path: evidence/
      - uses: actions/upload-artifact@v4
        with:
          name: pr8928-review-native-wheel
          path: wheels/*.whl
  integration:
    needs: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          path: payload
      - uses: actions/checkout@v4
        with:
          repository: agentic-os-org/ANOLISA
          ref: 5351c892f2e89d6be799ebdbeea948c173d3d7c2
          path: upstream
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.6'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: upstream/src/tokenless
      - name: Run the upstream integration target against the exact candidate
        run: python payload/.ci/pr8928-review/integration.py upstream evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr8928-review-full-integration
          path: evidence/
  native:
    needs: [unit, wheel]
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        agentscope: ['1.0.11', '2.0.3']
    steps:
      - uses: actions/checkout@v4
        with:
          path: payload
      - uses: actions/checkout@v4
        with:
          repository: agentic-os-org/ANOLISA
          ref: 5351c892f2e89d6be799ebdbeea948c173d3d7c2
          path: upstream
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.6'
      - uses: actions/download-artifact@v4
        with:
          name: pr8928-review-native-wheel
          path: wheels
      - name: Install the real framework and fresh native SDK
        run: python -m pip install wheels/*.whl 'agentscope==${{ matrix.agentscope }}' 'mcp>=1.13,<2' tqdm greenlet
      - name: Reproduce real SQLite failure, preserve the result, and verify recovery
        shell: bash
        run: |
          set -euo pipefail
          cp -a upstream/src/tokenless/python/agentscope/src baseline-adapter
          git -C upstream apply "$GITHUB_WORKSPACE/payload/.ci/pr8928-review/candidate.patch"
          mkdir -p evidence
          PYTHONPATH="$GITHUB_WORKSPACE/baseline-adapter" python payload/.ci/pr8928-review/native_probe.py baseline evidence/native-baseline.json > evidence/native-baseline.log 2>&1
          PYTHONPATH="$GITHUB_WORKSPACE/upstream/src/tokenless/python/agentscope/src" python payload/.ci/pr8928-review/native_probe.py fixed evidence/native-fixed.json > evidence/native-fixed.log 2>&1
          python -m pip freeze > evidence/installed-packages.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr8928-review-native-${{ matrix.agentscope }}
          path: evidence/
