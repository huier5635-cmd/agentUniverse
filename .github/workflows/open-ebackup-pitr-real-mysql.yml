name: Validate open-eBackup point-in-time replay on real MySQL

on:
  push:
    branches: [ci/open-ebackup-pitr-real-mysql-20261115]

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      TZ: UTC
      MYSQL_IMAGE: mysql:8.4.13
      UPSTREAM: 96ecbf1228f9e8c8a9baedcc4722ea06f61ea74b
      PITR_TARGET_PASSWORD: target-only-test-password
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Start two private MySQL test instances and generate a binary log
        shell: bash
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/pitr-fixture"
          mkdir -p "$fixture/valid" "$RUNNER_TEMP/mysql-tools"
          docker pull "$MYSQL_IMAGE"
          docker image inspect "$MYSQL_IMAGE" --format '{{join .RepoDigests " "}}'
          docker run -d --name pitr-source --network none \
            -e MYSQL_ROOT_PASSWORD=source-only-test-password -e TZ=UTC \
            -v "$fixture:$fixture:ro" "$MYSQL_IMAGE" \
            --server-id=31 --log-bin=mysql-bin --binlog-format=ROW --default-time-zone=+00:00
          docker run -d --name pitr-target --network none \
            -e "MYSQL_ROOT_PASSWORD=$PITR_TARGET_PASSWORD" -e MYSQL_ROOT_HOST=127.0.0.1 -e TZ=UTC \
            "$MYSQL_IMAGE" --server-id=32 --default-time-zone=+00:00
          source_sql() { docker exec pitr-source mysql -uroot -psource-only-test-password -NB -e "$1"; }
          target_sql() { docker exec pitr-target mysql -uroot -h127.0.0.1 "-p$PITR_TARGET_PASSWORD" -NB -e "$1"; }
          for _ in {1..75}; do
            if source_sql 'SELECT 1' > /dev/null 2>&1 && target_sql 'SELECT 1' > /dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          source_sql 'SELECT VERSION()'
          target_sql 'SELECT VERSION()'
          init='CREATE DATABASE pitr_fixture; CREATE TABLE pitr_fixture.events (id INT PRIMARY KEY)'
          source_sql "$init"
          target_sql "$init"
          source_sql 'FLUSH BINARY LOGS'
          filename=$(source_sql 'SHOW BINARY LOG STATUS' | cut -f1)
          [[ $filename =~ ^mysql-bin\.[0-9]+$ ]]
          snapshot=$(date +%s)
          source_sql 'INSERT INTO pitr_fixture.events VALUES (1)'
          cutoff=$(($(date +%s) + 2))
          sleep 4
          source_sql 'INSERT INTO pitr_fixture.events VALUES (2); FLUSH BINARY LOGS'
          docker cp "pitr-source:/var/lib/mysql/$filename" "$fixture/valid/$filename"
          chmod a+r "$fixture/valid/$filename"
          cat > "$RUNNER_TEMP/mysql-tools/mysqlbinlog" <<'SH'
          #!/usr/bin/env bash
          exec docker exec -i pitr-source mysqlbinlog "$@"
          SH
          cat > "$RUNNER_TEMP/mysql-tools/mysql" <<'SH'
          #!/usr/bin/env bash
          exec docker exec -i pitr-target mysql "$@"
          SH
          chmod +x "$RUNNER_TEMP/mysql-tools/mysqlbinlog" "$RUNNER_TEMP/mysql-tools/mysql"
          printf '%s\n' "$RUNNER_TEMP/mysql-tools" >> "$GITHUB_PATH"
          printf 'PITR_FIXTURE=%s\nPITR_BINLOG=%s\nPITR_SNAPSHOT=%s\nPITR_CUTOFF=%s\n' \
            "$fixture" "$filename" "$snapshot" "$cutoff" >> "$GITHUB_ENV"
      - name: Compare the original and candidate with real mysqlbinlog and mysql
        shell: bash
        run: |
          set -euo pipefail
          source="$RUNNER_TEMP/open-eBackup"
          validation="$GITHUB_WORKSPACE/validation/open-ebackup-pitr-real-mysql"
          git init --quiet "$source"
          git -C "$source" fetch --quiet --depth=1 --no-tags --filter=blob:none https://gitcode.com/eBackup/open-eBackup.git "$UPSTREAM"
          test "$(git -C "$source" rev-parse FETCH_HEAD)" = "$UPSTREAM"
          cd "$source"
          prefix=src/AppPlugins/database/applications
          for path in common/common.py common/const.py mysql/src/utils/restore_func.py mysql/src/service/restore/log_restore.py; do
            target="$prefix/$path"
            mkdir -p "$(dirname "$target")"
            git show "$UPSTREAM:$target" > "$target"
          done
          base_patch="$validation/pitr.patch"
          test "$(sha256sum "$base_patch" | cut -d' ' -f1)" = 5e676352161f14a5b77ab801ceeeffb1da3a98ad71e57c351f40560c37009198
          python3 "$validation/replay.py" "$source" original
          git apply --check "$base_patch"
          git apply "$base_patch"
          test "$(git hash-object "$prefix/common/common.py")" = 7789f09b834088314265111a505864a6fcff3ce5
          test "$(git hash-object "$prefix/mysql/src/service/restore/log_restore.py")" = da20fd49205ff9b8393c6ca0194fb16e3fecb5ca
          python3 "$validation/replay.py" "$source" candidate
      - name: Clean up fixture containers
        if: always()
        shell: bash
        run: |
          docker rm -f pitr-source pitr-target > /dev/null 2>&1 || true
