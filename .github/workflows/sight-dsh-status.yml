name: AgentSight dsh status plugin recheck
on:
  push:
    branches: [ci/sight-dsh-status]
permissions:
  contents: read
jobs:
  plugin:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        tools: ['0.1.0-rc.2', '0.1.0-rc.8', '0.2.0-rc.2']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: agentic-os-org/ANOLISA
          ref: d17f1190ff7c50a72ef8249e8333a2125b6d6055
          path: official
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
          run_install: false
      - name: Compare original, fixed and compiling mutation
        env:
          TOOLS_VERSION: ${{ matrix.tools }}
        run: python3 .ci/sight-dsh-status/verify.py --tools-version "$TOOLS_VERSION"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dsh-status-${{ matrix.tools }}
          path: evidence/
          if-no-files-found: error
