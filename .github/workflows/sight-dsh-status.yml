name: AgentSight rebased Rust gates
on:
  push:
    branches: [ci/sight-dsh-status]
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_BUILD_JOBS: '2'
      RUSTUP_TOOLCHAIN: '1.89.0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: agentic-os-org/ANOLISA
          ref: d17f1190ff7c50a72ef8249e8333a2125b6d6055
          path: official
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: official/src/agentsight
          shared-key: sight-dsh-status-gates
          cache-on-failure: true
      - name: Install native build dependencies in disposable runner
        run: |
          sudo apt-get update -q
          sudo apt-get install -y clang llvm libclang-dev libbpf-dev libelf-dev elfutils libssl-dev zlib1g-dev pkg-config perl
      - name: Run scoped component gates
        run: python3 .ci/sight-dsh-status/rust_gates.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dsh-status-rust-gates
          path: evidence/
          if-no-files-found: error

