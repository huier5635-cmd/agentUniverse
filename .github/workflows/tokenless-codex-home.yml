name: Tokenless Codex HOME conflict replay

on:
  push:
    branches: [ci/sight-mapping-hooks-20261115]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: agentic-os-org/ANOLISA
          ref: fc3cf6930c8d9efef63618c7928d760f975e056a
          path: upstream
          persist-credentials: false
      - name: Verify vulnerable baseline and replay the rebased tests
        working-directory: upstream
        run: |
          git apply --include='src/tokenless/tests/*' ../tokenless.patch
          suite=src/tokenless/tests/test-codex-adapter-install.sh
          detector=src/tokenless/adapters/tokenless/codex/scripts/detect.sh
          set +e
          bash "$suite" > "$RUNNER_TEMP/tokenless-original.log" 2>&1
          original=$?
          set -e
          cat "$RUNNER_TEMP/tokenless-original.log"
          test "$original" -eq 1
          grep -E '(FAIL|ERROR): test_detection_(ignores_each_relative_home_fallback|missing_home_is_read_only_and_fail_open)' "$RUNNER_TEMP/tokenless-original.log"
          git apply --exclude='src/tokenless/tests/*' ../tokenless.patch
          git diff --check
          bash -n "$detector"
          bash -n "$suite"
          shellcheck "$detector"
          bash "$suite"
