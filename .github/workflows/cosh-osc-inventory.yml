name: Validate cosh OSC test placement
on:
  push:
    branches: [ci/cosh-osc-inventory-20261115]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: agentic-os-org/ANOLISA
          ref: b9516bedad144591970f0cb9b348ed1620806ee6
          path: source
          persist-credentials: false
          sparse-checkout: |
            src/cosh-ng
            specs
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: source/src/cosh-ng
      - name: Install test audit dependency
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: python3 payload/validate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cosh-osc-inventory-evidence
          path: evidence
          if-no-files-found: ignore
