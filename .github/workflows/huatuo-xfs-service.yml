name: HUATUO XFS service hotplug review validation
on:
  push:
    branches: [ci/huatuo-xfs-service-integration]
permissions: {}
jobs:
  service-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: huier5635-cmd/huatuo
          ref: f1b141432275429cb094ce6e5381dc0ec7703225
          fetch-depth: 2
          path: source
          persist-credentials: false
      - name: Load host kernel filesystem modules before starting the service
        run: |
          sudo modprobe xfs
          sudo modprobe loop
          grep -qw xfs /proc/filesystems
      - name: Build the repository development toolchain
        run: docker build --target devel --progress plain -t huatuo-xfs-service -f source/Dockerfile.devel source
      - name: Validate original and fixed service output through the standard runner
        run: |
          mkdir -p xfs-service-logs
          docker image inspect huatuo-xfs-service > xfs-service-logs/image.json
          docker run --rm --privileged \
            -v /dev:/dev -v "$PWD/source:/workspace" \
            -v "$PWD/.ci/xfs-service:/evidence:ro" \
            -v "$PWD/xfs-service-logs:/logs" \
            -w /workspace huatuo-xfs-service sh -c 'apk add --no-cache bash && exec bash /evidence/run.sh'
      - name: Show verification results
        if: always()
        run: |
          for file in xfs-service-logs/*.log xfs-service-logs/*.json xfs-service-logs/cleanup.txt; do
            test ! -f "$file" || { echo "$file"; tail -45 "$file"; }
          done
      - name: Publish bounded verification diagnostics
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          logs=Path('xfs-service-logs')
          summary=logs/'summary.json'
          if summary.exists():
              message=summary.read_text()
              kind='notice'
          else:
              paths=sorted(logs.glob('*.log'),key=lambda p:p.stat().st_mtime)
              parts=[]
              for path in paths[-3:]:
                  parts.append(path.name+'\n'+path.read_text(errors='replace')[-5500:])
              focused=logs/'fixed-focused.jsonl'
              if focused.exists():
                  parts.append(focused.name+'\n'+focused.read_text(errors='replace')[-5500:])
              message='\n\n'.join(parts)[-18000:] or 'Validation did not produce test logs; inspect preceding setup step.'
              kind='error'
          message=message.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
          print('::'+kind+' title=XFS verification::'+message)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: huatuo-xfs-service-evidence
          path: xfs-service-logs
          retention-days: 30
