name: IvorySQL pg_hint_plan on Windows
on:
  push:
    branches:
      - ci/ivorysql-pg-hint-plan-windows

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install MSVC build prerequisites
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          choco install winflexbison3 -y --no-progress
          python -m pip install 'meson>=1.3,<2' ninja
      - name: Fetch the pinned native port and release sources
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          git -c core.longpaths=true init db
          git -C db config core.longpaths true
          git -C db fetch --depth=1 https://github.com/Muzzammil242/IvorySQL.git 7c1742cde16b699045c94fe053cc8798c1e093cd
          git -C db checkout --detach FETCH_HEAD
          $extension = 'db/contrib/pg_hint_plan'
          git init $extension
          git -C $extension fetch --depth=1 https://github.com/ossc-db/pg_hint_plan.git 4d3e9164dc2dc1b10dfe0c5e7a3cfe7983a8688d
          git -C $extension checkout --detach FETCH_HEAD
          Copy-Item -LiteralPath 'validation/pg_hint_plan/meson.build' -Destination "$extension/meson.build"
          Add-Content -LiteralPath 'db/contrib/meson.build' -Value "`nsubdir('pg_hint_plan')"
      - name: Build and install the native DLL
        shell: pwsh
        working-directory: db
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          meson setup build --vsenv --auto-features=disabled -Duuid=none -Dssl=none -Dbuildtype=release --prefix "$env:GITHUB_WORKSPACE/pg-install"
          meson compile -C build pg_hint_plan
          meson install -C build
          $bin = "$env:GITHUB_WORKSPACE/pg-install/bin"
          $library = Join-Path (& "$bin/pg_config.exe" --pkglibdir) 'pg_hint_plan.dll'
          Get-Item -LiteralPath $library | Select-Object Name,Length
      - name: Verify the query planner on both listeners
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $bin = "$env:GITHUB_WORKSPACE/pg-install/bin"
          $env:Path = "$bin;$env:Path"
          $cluster = "$env:RUNNER_TEMP/ivory-hint-plan"
          $log = "$env:RUNNER_TEMP/ivory-hint-plan.log"
          & "$bin/initdb.exe" -D $cluster -U postgres -A trust --encoding=UTF8 --no-locale
          & "$bin/pg_ctl.exe" -D $cluster -l $log -o "-p 55437 -h 127.0.0.1 -c ivorysql.port=55438 -c ivorysql.listen_addresses=127.0.0.1" -w start
          try {
            $common = @('-X', '-v', 'ON_ERROR_STOP=1', '-h', '127.0.0.1', '-U', 'postgres')
            & "$bin/psql.exe" @common -p 55437 -d postgres -c 'CREATE DATABASE plan_pg;'
            & "$bin/psql.exe" @common -p 55437 -d postgres -c 'CREATE DATABASE plan_ora;'
            $targets = [ordered]@{plan_pg = 55437; plan_ora = 55438}
            foreach ($db in $targets.Keys) {
              Write-Output "Testing $db on port $($targets[$db])"
              $result = & "$bin/psql.exe" @common -p $targets[$db] -d $db -At -f 'validation/pg_hint_plan/planner.sql'
              $result | Write-Output
              $baseline = [array]::IndexOf($result, 'baseline-plan')
              $hinted = [array]::IndexOf($result, 'hinted-plan')
              if ('version=1.9.0' -cnotin $result -or 'result=row-42' -cnotin $result -or
                  $baseline -lt 0 -or $hinted -le $baseline -or $hinted + 1 -ge $result.Count -or
                  $result[$baseline + 1] -notmatch '^Index Scan using hint_target_pkey on hint_target' -or
                  $result[$hinted + 1] -notmatch '^Seq Scan on hint_target') {
                throw "The SeqScan hint did not replace the baseline index scan in $db"
              }
              Write-Output "${db}: version 1.9.0 switched from an index scan to the requested sequential scan."
            }
          } finally {
            & "$bin/pg_ctl.exe" -D $cluster -m fast -w stop
          }
      - name: Print the database log on failure
        if: failure()
        shell: pwsh
        run: |
          $log = "$env:RUNNER_TEMP/ivory-hint-plan.log"
          if (Test-Path -LiteralPath $log) { Get-Content -LiteralPath $log -Tail 100 }
