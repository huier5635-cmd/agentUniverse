name: Verify IvorySQL REF typmod under assertions

on:
  push:
    branches: [ci/ivorysql-ref-typmod-3276-20261117]

permissions:
  contents: read

jobs:
  ref-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    strategy:
      fail-fast: false
      matrix:
        case: [baseline, fixed]
    env:
      REF_CASE: ${{ matrix.case }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: evidence
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: IvorySQL/IvorySQL
          ref: 475ab1956568da0e6e796902bf6e13a916396edd
          path: upstream
          persist-credentials: false
      - name: Install dependencies and apply the selected patch
        working-directory: upstream
        run: |
          set -euo pipefail
          patch="$GITHUB_WORKSPACE/evidence/ci-artifacts/ivorysql-ref-typmod/3276.patch"
          git apply --check "$patch"
          if [ "$REF_CASE" = baseline ]; then
            git apply --include=src/oracle_test/regress/sql/ref_type.sql "$patch"
            test "$(git hash-object src/backend/oracle_parser/ora_gram.y)" = b9e033ab77a42c445be523787a79117969b59b14
          else
            git apply "$patch"
            test "$(git hash-object src/backend/oracle_parser/ora_gram.y)" = b054ee4a54dbb5357cd2e96ee7096cff47b82bd6
            test "$(git hash-object src/oracle_test/regress/expected/ref_type.out)" = 0fe4c1088f03eeefcf9242364b160bf81a18bf05
          fi
          test "$(git hash-object src/oracle_test/regress/sql/ref_type.sql)" = 2ef04052b5197251e2ccf1e0a6f02d9498e7efd1
          git diff --check
          sudo apt-get update -q
          sudo apt-get install -y bison flex libreadline-dev zlib1g-dev uuid-dev libicu-dev libxml2-dev libxslt1-dev libcurl4-openssl-dev
          ./configure --prefix="$RUNNER_TEMP/ivory-ref-prefix" --enable-cassert --with-uuid=e2fs --with-icu --with-libxml --with-libxslt
          make -j"$(nproc)" world-bin > "$RUNNER_TEMP/ref-build.log" 2>&1 || { tail -n 100 "$RUNNER_TEMP/ref-build.log"; exit 1; }
      - name: Run the native Oracle REF regression
        working-directory: upstream
        run: |
          set -euo pipefail
          result=0
          make -j1 oracle-check-tests TESTS=ref_type > "$RUNNER_TEMP/ref-suite.log" 2>&1 || result=$?
          tail -n 45 "$RUNNER_TEMP/ref-suite.log"
          log=src/oracle_test/regress/log/postmaster.log
          if [ "$REF_CASE" = baseline ]; then
            test "$result" -ne 0
            grep -F '*typmod == -1' "$log"
          elif [ "$result" -ne 0 ]; then
            if test -f "$log"; then tail -n 60 "$log"; fi
            if test -f src/oracle_test/regress/regression.diffs; then tail -n 140 src/oracle_test/regress/regression.diffs; fi
            exit "$result"
          else
            grep -E '^ok .*ref_type' "$RUNNER_TEMP/ref-suite.log"
          fi
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ivorysql-ref-typmod-${{ matrix.case }}
          path: |
            ${{ runner.temp }}/ref-*.log
            upstream/src/oracle_test/regress/log/postmaster.log
            upstream/src/oracle_test/regress/regression.diffs
          if-no-files-found: warn
