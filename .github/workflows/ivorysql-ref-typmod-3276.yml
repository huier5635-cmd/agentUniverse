name: Verify IvorySQL REF typmod under assertions

on:
  push:
    branches: [ci/ivorysql-ref-typmod-3276-20261117]

permissions:
  contents: read

jobs:
  ref-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          path: evidence
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: IvorySQL/IvorySQL
          ref: 475ab1956568da0e6e796902bf6e13a916396edd
          path: upstream
          persist-credentials: false
      - name: Build the unmodified server with assertions enabled
        working-directory: upstream
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/ivory-ref-prefix"
          echo "IVORY_REF_PREFIX=$prefix" >> "$GITHUB_ENV"
          sudo apt-get update -q
          sudo apt-get install -y bison flex libreadline-dev zlib1g-dev uuid-dev libicu-dev libxml2-dev libxslt1-dev libcurl4-openssl-dev
          ./configure --prefix="$prefix" --enable-cassert --with-uuid=e2fs --with-icu --with-libxml --with-libxslt
          make -j"$(nproc)" world-bin > "$RUNNER_TEMP/ref-build.log" 2>&1 || { tail -n 100 "$RUNNER_TEMP/ref-build.log"; exit 1; }
      - name: Reproduce the REF assertion using the Oracle regression fixture
        working-directory: upstream
        run: |
          set -euo pipefail
          patch="$GITHUB_WORKSPACE/evidence/ci-artifacts/ivorysql-ref-typmod/3276.patch"
          sql=src/oracle_test/regress/sql/ref_type.sql
          git apply --include="$sql" "$patch"
          if make -j1 oracle-check-tests TESTS=ref_type > "$RUNNER_TEMP/ref-baseline-suite.log" 2>&1; then
            echo 'Baseline did not fail'
            exit 1
          fi
          tail -n 55 "$RUNNER_TEMP/ref-baseline-suite.log"
          find src/oracle_test/regress -type f \( -path '*/log/*' -o -name '*.log' \) -print0 | xargs -0 -r grep -F '*typmod == -1' > "$RUNNER_TEMP/ref-baseline-assert.log"
          test -s "$RUNNER_TEMP/ref-baseline-assert.log"
          cat "$RUNNER_TEMP/ref-baseline-assert.log"
          git restore -- "$sql"
      - name: Verify the exact patch and run the upstream REF suite
        working-directory: upstream
        run: |
          set -euo pipefail
          patch="$GITHUB_WORKSPACE/evidence/ci-artifacts/ivorysql-ref-typmod/3276.patch"
          git apply --check "$patch"
          git apply "$patch"
          git diff --check
          test "$(git hash-object src/backend/oracle_parser/ora_gram.y)" = b054ee4a54dbb5357cd2e96ee7096cff47b82bd6
          test "$(git hash-object src/oracle_test/regress/sql/ref_type.sql)" = 2ef04052b5197251e2ccf1e0a6f02d9498e7efd1
          test "$(git hash-object src/oracle_test/regress/expected/ref_type.out)" = 0fe4c1088f03eeefcf9242364b160bf81a18bf05
          make -j"$(nproc)" world-bin > "$RUNNER_TEMP/ref-rebuild.log" 2>&1 || { tail -n 100 "$RUNNER_TEMP/ref-rebuild.log"; exit 1; }
          make -j1 oracle-check-tests TESTS=ref_type > "$RUNNER_TEMP/ref-suite.log" 2>&1 || { tail -n 100 "$RUNNER_TEMP/ref-suite.log"; if test -f src/oracle_test/regress/regression.diffs; then tail -n 150 src/oracle_test/regress/regression.diffs; fi; exit 1; }
          grep -E '(^ok .*ref_type|tests passed)' "$RUNNER_TEMP/ref-suite.log"
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ivorysql-ref-typmod-3276
          path: |
            ${{ runner.temp }}/ref-*.log
            upstream/src/oracle_test/regress/regression.diffs
          if-no-files-found: warn
