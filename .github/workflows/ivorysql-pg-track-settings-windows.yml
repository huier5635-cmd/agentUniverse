name: IvorySQL pg_track_settings on Windows
on:
  push:
    branches:
      - ci/ivorysql-pg-track-settings-windows

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install MSVC build prerequisites
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          choco install winflexbison3 -y --no-progress
          python -m pip install 'meson>=1.3,<2' ninja
      - name: Check out the Windows port and the extension release
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          git -c core.longpaths=true init db
          git -C db config core.longpaths true
          git -C db fetch --depth=1 https://github.com/Muzzammil242/IvorySQL.git 7c1742cde16b699045c94fe053cc8798c1e093cd
          git -C db checkout --detach FETCH_HEAD
          git init pg-track-settings
          git -C pg-track-settings fetch --depth=1 https://github.com/rjuju/pg_track_settings.git 36a23f3c6d684c40140da1a24b1c3ee0e707b77a
          git -C pg-track-settings checkout --detach FETCH_HEAD
      - name: Build and install IvorySQL with MSVC
        working-directory: db
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          meson setup build --vsenv --auto-features=disabled -Duuid=none -Dssl=none -Dbuildtype=release --prefix "$env:GITHUB_WORKSPACE/pg-install"
          meson install -C build
      - name: Install the SQL extension and verify both listeners
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $bin = "$env:GITHUB_WORKSPACE/pg-install/bin"
          $env:Path = "$bin;$env:Path"
          $sharedir = & "$bin/pg_config.exe" --sharedir
          $extdir = Join-Path $sharedir extension
          $package = Get-ChildItem -LiteralPath pg-track-settings -File |
            Where-Object Name -Match '^pg_track_settings(\.control|--.*\.sql)$'
          if ($package.Count -ne 13) { throw "Unexpected extension file count: $($package.Count)" }
          $package | Copy-Item -Destination $extdir

          $cluster = "$env:RUNNER_TEMP/ivory-track-settings"
          $serverLog = "$env:RUNNER_TEMP/ivory-track-settings.log"
          & "$bin/initdb.exe" -D $cluster -U postgres -A trust --encoding=UTF8 --no-locale
          & "$bin/pg_ctl.exe" -D $cluster -l $serverLog -o "-p 55437 -h 127.0.0.1 -c ivorysql.port=55438 -c ivorysql.listen_addresses=127.0.0.1" -w start
          try {
            $base = @('-X', '-v', 'ON_ERROR_STOP=1', '-h', '127.0.0.1', '-U', 'postgres')
            & "$bin/psql.exe" @base -p 55437 -d postgres -c 'CREATE DATABASE pgts_pg;'
            & "$bin/psql.exe" @base -p 55437 -d postgres -c 'CREATE DATABASE pgts_ora;'

            $script = @'
          CREATE EXTENSION pg_track_settings;
          SELECT 'version=' || extversion FROM pg_catalog.pg_extension
            WHERE extname = 'pg_track_settings';
          SELECT pg_track_settings_snapshot();
          ALTER DATABASE :dbname SET work_mem = '11MB';
          SELECT pg_track_settings_snapshot();
          SELECT 'recorded=' || count(*) FROM pg_track_db_role_settings_log('work_mem')
            WHERE setdatabase = (SELECT oid FROM pg_catalog.pg_database WHERE datname = :'dbname')
              AND setting_exists AND setting = '11MB';
          ALTER DATABASE :dbname RESET work_mem;
          SELECT pg_track_settings_snapshot();
          SELECT 'reset=' || count(*) FROM pg_track_db_role_settings_log('work_mem')
            WHERE setdatabase = (SELECT oid FROM pg_catalog.pg_database WHERE datname = :'dbname')
              AND NOT setting_exists;
          '@
            $testFile = "$env:RUNNER_TEMP/verify-pg-track-settings.sql"
            Set-Content -LiteralPath $testFile -Value $script -Encoding utf8NoBOM
            $targets = [ordered]@{ pgts_pg = 55437; pgts_ora = 55438 }
            foreach ($db in $targets.Keys) {
              $result = & "$bin/psql.exe" @base -p $targets[$db] -d $db -At -v "dbname=$db" -f $testFile
              $result | Write-Output
              foreach ($expected in 'version=2.1.2', 'recorded=1', 'reset=1') {
                if ($expected -cnotin $result) { throw "$db did not report $expected" }
              }
              Write-Output "${db}: extension install and setting history passed."
            }
          } finally {
            & "$bin/pg_ctl.exe" -D $cluster -m fast -w stop
          }
      - name: Print the database log if validation fails
        if: failure()
        shell: pwsh
        run: |
          $log = "$env:RUNNER_TEMP/ivory-track-settings.log"
          if (Test-Path -LiteralPath $log) { Get-Content -LiteralPath $log -Tail 100 }
