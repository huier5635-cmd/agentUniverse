name: HUATUO existing PR refresh validation
on:
  push:
    branches: [ci/huatuo-refresh-three-prs-20261023]
permissions:
  contents: read
jobs:
  regressions-and-required-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ccfos/huatuo
          ref: bdcee2d10d872c9c693a87994cf1f63f9b4340dd
          path: source
          persist-credentials: false
      - name: Build official development image once
        working-directory: source
        run: docker build --target devel --progress plain -t huatuo-three-refresh -f Dockerfile.devel .
      - name: Start isolated local OpenSearch integration fixture
        run: |
          docker run -d --name huatuo-refresh-opensearch -p 127.0.0.1:9200:9200 -e discovery.type=single-node -e DISABLE_SECURITY_PLUGIN=true -e node.store.allow_mmap=false -e 'OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m' opensearchproject/opensearch:2.19.0
          python3 - <<'PY'
          import json,time,urllib.request
          for attempt in range(90):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:9200',timeout=3) as response:
                      data=json.load(response)
                  assert data['version']['number']=='2.19.0'
                  print(json.dumps(data))
                  break
              except Exception:
                  if attempt==89: raise
                  time.sleep(2)
          PY
      - name: Reproduce unchanged upstream, verify each refreshed PR, and run required checks
        run: python3 .ci/refresh/verify.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: huatuo-three-pr-refresh-evidence
          path: .ci/refresh/evidence
          retention-days: 5
      - name: Remove only the disposable integration fixture
        if: always()
        run: docker rm -f huatuo-refresh-opensearch
