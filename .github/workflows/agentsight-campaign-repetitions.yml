name: Validate AgentSight campaign repetition numbers
on:
  push:
    branches: [ci/sight-campaign-repetitions-20261124]
permissions:
  contents: read

jobs:
  reporting:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      UPSTREAM: 5bb9a8903988f98a6c41d3334bc523d6010f1855
      BENCHMARK: src/agentsight/scripts/benchmark
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.6'
      - name: Apply the patch to the pinned official source
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git init source
          git -C source remote add origin https://github.com/agentic-os-org/ANOLISA.git
          git -C source config remote.origin.promisor true
          git -C source config remote.origin.partialclonefilter blob:none
          git -C source sparse-checkout set --no-cone "/$BENCHMARK/" '/.github/workflows/ci.yaml'
          git -C source fetch --no-tags --depth=1 --filter=blob:none origin "$UPSTREAM"
          test "$(git -C source rev-parse FETCH_HEAD)" = "$UPSTREAM"
          git -C source checkout --detach FETCH_HEAD
          patch="$GITHUB_WORKSPACE/validation/campaign-repetitions.patch"
          sha256sum --check "$GITHUB_WORKSPACE/validation/campaign-repetitions.sha256"
          git -C source apply --check "$patch"
          git -C source apply "$patch"
          git -C source diff --check
      - name: Check campaign, counter, and resource reports
        working-directory: source/src/agentsight/scripts/benchmark
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt
          python -m pytest -q \
            tests/test_campaign_*.py \
            tests/test_counter_deltas.py \
            tests/test_plot_reports.py \
            tests/test_report_load_evidence.py \
            tests/test_resource_cpu_intervals.py \
            tests/test_resource_report.py \
            tests/test_resource_trend_clock.py
