name: Verify CPQCTorchkit checkpoint device portability
on: push
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CUDA_VISIBLE_DEVICES: ''
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          path: validation
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: qboson/kaiwu-pytorch-plugin
          ref: 393a5f126e3bf3e26ef5c87a0c60ec4d1eb9e51f
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install CPU test dependencies
        working-directory: source
        run: |
          python -m pip install torch==2.7.0 torchvision==0.22.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements/devel.txt kaiwu==1.3.1 scikit-learn==1.7.2 scipy==1.14.1 tqdm==4.67.1
          python -m pip install -r requirements/requirements_example.txt
          python -m pip install .
          python -c 'import imageio, torchvision, torchmetrics, pandas, seaborn, tqdm'
      - name: Reproduce CPU deserialization failure and validate the candidate
        working-directory: source
        run: |
          patch="$GITHUB_WORKSPACE/validation/validation/checkpoint-device.patch"
          test "$(git rev-parse HEAD)" = 393a5f126e3bf3e26ef5c87a0c60ec4d1eb9e51f
          git apply --check "$patch"
          git apply --check --whitespace=error "$patch"
          git apply --include=tests/test_mnist_checkpoint_device.py "$patch"
          baseline="$RUNNER_TEMP/checkpoint-before.log"
          code=0
          python -m pytest -q tests/test_mnist_checkpoint_device.py >"$baseline" 2>&1 || code=$?
          cat "$baseline"
          test "$code" -eq 1
          grep -F "Attempting to deserialize object on a CUDA device" "$baseline"
          grep -E '1 failed, 2 passed' "$baseline"
          git apply --exclude=tests/test_mnist_checkpoint_device.py "$patch"
          git diff --check
          python -m pytest -q -rs tests/test_mnist_checkpoint_device.py tests/test_mnist_device_placement.py tests/test_mnist_import_isolation.py
