name: Verify frozen AgentSight DSH dependencies

on:
  push:
    branches: [ci/agentsight-dsh-lock-20261115]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: validation
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: agentic-os-org/ANOLISA
          ref: refs/pull/9072/head
          path: source
          persist-credentials: false
          sparse-checkout: src/agentsight/dsh-plugin

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'

      - name: Install and test the locked dependencies
        working-directory: source/src/agentsight/dsh-plugin
        run: |
          test "$(git rev-parse HEAD)" = 8ce82e14ab11efee26d71b7986d0fdf68543370b
          test "$(git hash-object package.json)" = 56082555c40ef6017d63e0308b48f3b29fd8a68c
          test "$(pnpm --version)" = 11.25.0
          node --version
          root="$GITHUB_WORKSPACE/validation/validation/agentsight-dsh-locked"
          cp "$root/pnpm-lock.yaml" pnpm-lock.yaml
          test "$(git hash-object pnpm-lock.yaml)" = 0b70321854d9909b47785c6ef00caeafaa852ebd
          pnpm install --frozen-lockfile --ignore-scripts
          cmp pnpm-lock.yaml "$root/pnpm-lock.yaml"
          pnpm test

      - name: Reject a manifest change without a lockfile update
        working-directory: source/src/agentsight/dsh-plugin
        run: |
          probe="$(mktemp -d)"
          cp package.json pnpm-lock.yaml "$probe/"
          node --input-type=module - "$probe/package.json" <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          const path = process.argv[2];
          const manifest = JSON.parse(readFileSync(path, 'utf8'));
          manifest.devDependencies.typescript = '5.5.4';
          writeFileSync(path, JSON.stringify(manifest));
          JS
          if pnpm --dir "$probe" install --frozen-lockfile --ignore-scripts >"$probe/out.log" 2>&1; then
            echo 'Frozen install unexpectedly accepted stale dependency metadata'
            exit 1
          fi
          cat "$probe/out.log"
          grep -F ERR_PNPM_OUTDATED_LOCKFILE "$probe/out.log"
          cmp pnpm-lock.yaml "$probe/pnpm-lock.yaml"

      - name: Lint the proposed workflow
        run: |
          printf '%s\n' 'self-hosted-runner:' '  labels:' '    - anolisa-k8s-general-ci-x64' > "$RUNNER_TEMP/actionlint.yaml"
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -config-file "$RUNNER_TEMP/actionlint.yaml" validation/validation/agentsight-dsh-locked/agentsight-dsh-plugin.yml
