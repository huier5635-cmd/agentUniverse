name: Verify the CPQCTorchkit ETTh1 CPU quick start
on:
  push:
    branches: [ci/cpqc-etth1-license-quickstart-20261122]
permissions:
  contents: read

jobs:
  quickstart:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        kaiwu: ['1.3.1', '1.4.3']
    env:
      CUDA_VISIBLE_DEVICES: ''
      OMP_NUM_THREADS: '3'
      MKL_NUM_THREADS: '3'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: huier5635-cmd/kaiwu-pytorch-plugin
          ref: 1980731897cb519d4d008225cc3fa1e3fc1c9953
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install PyTorch, Kaiwu, and the example
        env:
          KAIWU_VERSION: ${{ matrix.kaiwu }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 1980731897cb519d4d008225cc3fa1e3fc1c9953
          test "$(git hash-object example/qdeq/README.md)" = d3b80cc025c289bcd417f3a576a0f3fa99c9f335
          test "$(git hash-object example/qdeq/README_ZH.md)" = 3016ea5e6d408770d4f1ce0d5ccb22b5a45289ab
          python -m pip install torch==2.7.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --only-binary=:all: numpy==2.2.6 "kaiwu==$KAIWU_VERSION"
          python -m pip install -e .
          python -m pip install -r example/qdeq/requirements.txt
          python -m pip check
      - name: Run the documented CPU train and forecast commands
        run: |
          set -euo pipefail
          dataset=example/qdeq/data/ETTh1.csv
          mkdir -p "$(dirname "$dataset")"
          curl --fail --location --retry 2 \
            https://raw.githubusercontent.com/zhouhaoyi/ETDataset/11ab373cf9c9f5be7698e219a5a170e1b1c8a930/ETT-small/ETTh1.csv \
            --output "$dataset"
          printf '%s  %s\n' f18de3ad269cef59bb07b5438d79bb3042d3be49bdeecf01c1cd6d29695ee066 "$dataset" | sha256sum -c -
          python example/qdeq/simple/simple_train_example.py --sampler anderson </dev/null | tee "$RUNNER_TEMP/train.log"
          test -s example/qdeq/checkpoints/simple_etth1.pt
          python example/qdeq/simple/simple_forecast_example.py --sampler anderson </dev/null | tee "$RUNNER_TEMP/forecast.log"
          test "$(grep -Ec '^epoch [12]: train mse [0-9]+\.[0-9]+' "$RUNNER_TEMP/train.log")" -eq 2
          trained="$(grep -E '^test mse [0-9]+\.[0-9]+' "$RUNNER_TEMP/train.log")"
          forecast="$(sed -n 's/^anderson: \(test mse .*\)$/\1/p' "$RUNNER_TEMP/forecast.log")"
          test -n "$trained" && test "$trained" = "$forecast"
          grep -F 'first test window, variable OT' "$RUNNER_TEMP/forecast.log"
