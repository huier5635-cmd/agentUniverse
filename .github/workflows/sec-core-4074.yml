name: Sec-Core Bash rule profile near the frame limit

on:
  push:
    branches: [ci/sec-core-4074-prefilter-20261115]

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: agentic-os-org/ANOLISA
          ref: 95dd38ee23ece0198d37605ec61be2145156f127
          path: upstream
          persist-credentials: false
      - name: Measure each shipped rule on the same input
        run: |
          rustup toolchain install 1.93.0 --profile minimal
          v2=upstream/src/agent-sec-core/v2
          crate="$v2/crates/asc-capability-code-scan"
          cp engine.rs "$crate/src/engine.rs"
          mkdir -p "$crate/src/engine"
          cp prefilter.rs "$crate/src/engine/prefilter.rs"
          cp profile-bash-rules.rs "$crate/src/engine/large_scan_profile.rs"
          printf '\n#[cfg(test)]\nmod large_scan_profile;\n' >> "$crate/src/engine.rs"
          cp scanner-Cargo.toml "$crate/Cargo.toml"
          cd "$v2"
          python3 - <<'PY'
          from pathlib import Path
          lockfile = Path('Cargo.lock')
          text = lockfile.read_text()
          start = text.index('name = "asc-capability-code-scan"')
          end = text.index('\n[[package]]', start)
          package = text[start:end]
          dependency = ' "fancy-regex",\n'
          assert package.count(dependency) == 1
          lockfile.write_text(text[:start] + package.replace(dependency, dependency + ' "regex",\n') + text[end:])
          PY
          cargo +1.93.0 test --locked -p asc-capability-code-scan --lib engine::large_scan_profile::profile_each_shipped_bash_rule_at_the_frame_limit -- --exact --nocapture
      - name: Verify the relaxed expression's quantified assertion semantics
        working-directory: upstream/src/agent-sec-core/v2
        run: cargo +1.93.0 test --locked -p asc-capability-code-scan --lib engine::prefilter::tests::removed_quantified_assertion_does_not_bind_to_the_previous_token -- --exact
