name: HUATUO command-line review follow-up validation
on:
  push:
    branches: [ci/huatuo-commandline-prefix]
permissions:
  contents: read
jobs:
  regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.3'
          cache: false
      - name: Checkout pinned upstream
        uses: actions/checkout@v4
        with:
          repository: ccfos/huatuo
          ref: 0ab7dc442b245e2ec9b88a3e0705a048ca560ddb
          path: source
          persist-credentials: false
      - name: Reproduce, test, race-check, and benchmark the real process package
        run: python3 .ci/huatuo-commandline/verify.py source
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: huatuo-commandline-regressions
          path: .ci/huatuo-commandline/evidence
          retention-days: 5
  repository-check:
    needs: regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout pinned upstream
        uses: actions/checkout@v4
        with:
          repository: ccfos/huatuo
          ref: 0ab7dc442b245e2ec9b88a3e0705a048ca560ddb
          path: source
          persist-credentials: false
      - name: Verify and overlay frozen source
        run: |
          python3 - <<'PY'
          import hashlib,json,shutil
          from pathlib import Path
          here=Path('.ci/huatuo-commandline')
          manifest=json.loads((here/'manifest.json').read_text())
          for relative,expected in manifest['baseline'].items():
              data=(Path('source')/relative).read_bytes()
              assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==expected
          for relative,expected in manifest['fixed'].items():
              data=(here/'fixed'/relative).read_bytes()
              assert hashlib.sha256(data).hexdigest()==expected
              shutil.copyfile(here/'fixed'/relative,Path('source')/relative)
          PY
          git -C source add internal/process/process.go internal/process/process_test.go
          actual_tree=$(git -C source write-tree)
          test "$actual_tree" = '075d31f34023b26abed37f4366f30980c8fa2430'
          echo "TESTED_SOURCE_TREE=$actual_tree"
      - name: Build the official development toolchain
        working-directory: source
        run: docker build --target devel --progress plain -t huatuo-commandline-check -f Dockerfile.devel .
      - name: Run full build and mandatory check
        working-directory: source
        run: |
          set -o pipefail
          mkdir -p ../.ci/huatuo-commandline/evidence
          docker run --rm -v "$PWD:/workspace" -w /workspace huatuo-commandline-check sh -ec '
            git config --global --add safe.directory /workspace
            make build
            make check
          ' 2>&1 | tee ../.ci/huatuo-commandline/evidence/build-check.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: huatuo-commandline-review-required-check
          path: .ci/huatuo-commandline/evidence
          retention-days: 5
