name: ANOLISA prepare cleanup validation
on:
  push:
    branches: [ci/anolisa-swe-cleanup]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: agentic-os-org/ANOLISA
          ref: 6e47beddfee351d01a5e47f55324605e138005f6
          path: official
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install --index-url https://pypi.org/simple pytest ruff pydantic pydantic-settings rich jinja2 typer httpx json5
          python -m pip install --index-url https://pypi.org/simple --no-deps -e official/benchmark/swe-runner
      - name: Validate baseline and fixed source
        run: python .ci/anolisa-swe/validate.py
      - name: Publish verification summary
        if: always()
        run: |
          python - <<'PY'
          import pathlib
          p=pathlib.Path('evidence/summary.json')
          if p.exists():
              print('::notice title=ANOLISA cleanup validation::'+p.read_text().replace('%','%25').replace('\n','%0A'))
          else:
              logs=sorted(pathlib.Path('evidence').glob('*.log'))
              for log in logs:
                  tail=log.read_text(errors='replace')[-2500:].replace('%','%25').replace('\r','%0D').replace('\n','%0A')
                  print('::warning title='+log.name+'::'+tail)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: anolisa-swe-cleanup-evidence
          path: evidence/
          if-no-files-found: error
