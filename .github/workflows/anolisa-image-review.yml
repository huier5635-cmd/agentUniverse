name: ANOLISA image endpoint review validation
on:
  push:
    branches: [ci/anolisa-image-review]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.8.18']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/checkout@v4
        with:
          repository: agentic-os-org/ANOLISA
          ref: 5351c892f2e89d6be799ebdbeea948c173d3d7c2
          path: upstream
          persist-credentials: false
      - name: Install formatting and lint tools
        if: matrix.python == '3.11.6'
        run: python -m pip install black==25.1.0 isort==5.13.2 ruff==0.11.13
      - name: Verify original, previous head, candidate and guard mutation
        run: python -B ci/anolisa-image-http-errors/validate.py upstream evidence/image-review
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: image-review-${{ matrix.python }}
          path: evidence/image-review
