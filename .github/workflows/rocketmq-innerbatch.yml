name: RocketMQ inner-batch boundary validation
on:
  push:
    branches: [ci/rocketmq-innerbatch-bounds]
permissions:
  contents: read
jobs:
  native-maven:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: apache/rocketmq
          ref: 38a7ca0d23a3e2d4339f9a2bf6e78cf541eed9e3
          path: source
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: corretto
          cache: maven
      - name: Record toolchain
        run: |
          java -version
          mvn -version
          git -C source submodule status --recursive
      - name: Reproduce original stall and validate actual fixed modules
        run: python3 .ci/innerbatch/verify.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rocketmq-innerbatch-evidence
          path: .ci/innerbatch/evidence
          retention-days: 30
