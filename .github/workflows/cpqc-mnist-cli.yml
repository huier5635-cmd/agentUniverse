name: Verify the CPQCTorchkit MNIST CLI and checkpoint changes

on:
  push:
    branches: [ci/cpqc-mnist-cli-20261128]

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CUDA_VISIBLE_DEVICES: ''
      MPLBACKEND: Agg
      OMP_NUM_THREADS: '2'
      BASE: 393a5f126e3bf3e26ef5c87a0c60ec4d1eb9e51f
      TRAINER_BASE: cbef8d86b297963326b92eeabd9d32be2a640c21
      TRAINER_HEAD: 1cfb847bc63758c8ed33272ac5d3761d13ff1206
      CHECKPOINT_HEAD: 31f82d59df332b839c11beeb6f80fe379f1ee12e
      CANDIDATE_TREE: 8ec81ef4850d6a6f3e9cac3af88fa4022619eeaf
    steps:
      - uses: actions/checkout@v4
        with:
          path: validation
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: qboson/kaiwu-pytorch-plugin
          ref: 393a5f126e3bf3e26ef5c87a0c60ec4d1eb9e51f
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install the CPU and example dependencies
        working-directory: source
        shell: bash
        run: |
          python -m pip install torch==2.7.0 torchvision==0.22.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements/devel.txt kaiwu==1.3.1 scikit-learn==1.7.2 scipy==1.14.1 tqdm==4.67.1
          python -m pip install -r requirements/requirements_example.txt
          python -m pip install .
          python -c 'import gif, imageio, torchvision, torchmetrics, pandas, seaborn, sklearn'
      - name: Reproduce the CLI problem with the existing trainer PR applied
        working-directory: source
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin "$TRAINER_BASE"             refs/pull/1906/head:refs/heads/check-trainer refs/pull/485/head:refs/heads/check-checkpoint
          test "$(git rev-parse check-trainer)" = "$TRAINER_HEAD"
          test "$(git rev-parse check-checkpoint)" = "$CHECKPOINT_HEAD"
          test "$(git rev-parse HEAD)" = "$BASE"
          git diff --binary "$TRAINER_BASE" "$TRAINER_HEAD" > "$RUNNER_TEMP/trainer.patch"
          git diff --binary "$BASE" "$CHECKPOINT_HEAD" > "$RUNNER_TEMP/checkpoint.patch"
          git apply --index --whitespace=error "$RUNNER_TEMP/trainer.patch"
          patch="$GITHUB_WORKSPACE/validation/validation/cli.patch"
          git apply --check --whitespace=error "$patch"
          git apply --index --include=tests/test_mnist_cli_evaluation.py "$patch"
          log="$RUNNER_TEMP/old-cli.log"
          rc=0
          python -m pytest -q tests/test_mnist_cli_evaluation.py >"$log" 2>&1 || rc=$?
          cat "$log"
          test "$rc" -eq 1
          grep -F '5 failed, 1 passed' "$log"
      - name: Verify the original PR plus the CLI fix and checkpoint change
        working-directory: source
        shell: bash
        run: |
          patch="$GITHUB_WORKSPACE/validation/validation/cli.patch"
          git apply --index --exclude=tests/test_mnist_cli_evaluation.py "$patch"
          git diff --cached --check
          tree=$(git write-tree)
          printf 'Validated PR 1906 tree: %s\n' "$tree"
          test "$tree" = "$CANDIDATE_TREE"
          python -m pytest -q tests/test_mnist_cli_evaluation.py
          git apply --index --whitespace=error "$RUNNER_TEMP/checkpoint.patch"
          git diff --cached --check
          printf 'Combined source tree: %s\n' "$(git write-tree)"
          log="$RUNNER_TEMP/mnist-combined.log"
          python -m pytest -q -rs tests/test_mnist_cli_evaluation.py             tests/test_mnist_checkpoint_device.py tests/test_mnist_device_placement.py             tests/test_mnist_import_isolation.py | tee "$log"
          grep -E '18 passed, 4 skipped' "$log"
