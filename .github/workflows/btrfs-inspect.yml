name: Btrfs mount final source gates
on:
  push:
    branches: [ci/ckpt-btrfs-mount-wip-20261023]
permissions:
  contents: read
jobs:
  gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        gate: [package-docs, rust-coverage]
    steps:
      - uses: actions/checkout@v4
        with:
          path: payload
      - uses: actions/checkout@v4
        with:
          repository: agentic-os-org/ANOLISA
          ref: 5351c892f2e89d6be799ebdbeea948c173d3d7c2
          path: upstream
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        if: matrix.gate == 'rust-coverage'
        with:
          workspaces: upstream/src/ws-ckpt/src
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.6'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: taiki-e/install-action@v2
        if: matrix.gate == 'rust-coverage'
        with:
          tool: cargo-tarpaulin@0.37.2
          fallback: none
      - name: Install filesystem utilities
        run: sudo apt-get update -qq && sudo apt-get install -y btrfs-progs rsync
      - name: Compare baseline and candidate coverage without filtering tests
        if: matrix.gate == 'rust-coverage'
        run: python payload/.ci/btrfs-final/coverage_compare.py upstream coverage-evidence
      - name: Verify final source and component gates
        if: matrix.gate == 'package-docs'
        run: python payload/.ci/btrfs-final/final_gates.py upstream evidence ${{ matrix.gate }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: btrfs-final-${{ matrix.gate }}
          path: |
            evidence/
            coverage-evidence/
