name: Inspect Btrfs mount restoration implementation
on:
  push:
    branches: [ci/ckpt-btrfs-mount-wip-20261023]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: payload
      - uses: actions/checkout@v4
        with:
          repository: agentic-os-org/ANOLISA
          ref: 5351c892f2e89d6be799ebdbeea948c173d3d7c2
          path: upstream
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: upstream/src/ws-ckpt/src
      - name: Install native filesystem fixtures
        run: sudo apt-get update -qq && sudo apt-get install -y btrfs-progs rsync dmsetup
      - name: Compile and validate native restart policies
        run: python3 payload/.ci/btrfs-inspect/validate_btrfs.py upstream evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: btrfs-implementation-inspection
          path: evidence/
