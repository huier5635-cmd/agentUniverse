name: Complete document publication validation
on:
  push:
    branches: [ci/document-output-no-clobber]
permissions: {}
jobs:
  linux-documents:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 5
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Verify pinned proposed source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 9fe5387b979517246a9bafa7ee2ad163ff27148e
          test "$(git rev-parse 'HEAD^'^{tree})" = ba524351b44262fdbbc2301bdc3ec68bb5da3a9c
          test "$(git diff --name-only HEAD^ HEAD | wc -l)" -eq 3
      - name: Install the isolated native document stack
        run: |
          python -m pip install pytest==8.3.5 pydantic==2.6.4 langchain==0.1.20 langchain-community==0.0.38 loguru==0.7.2 tomli==2.2.1 opentelemetry-sdk==1.25.0 python-docx==1.2.0 python-pptx==1.0.2 pypdf==6.10.0
          python -c "import sys,os,pydantic,docx,pptx,pypdf; print(sys.version,os.name,pydantic.__version__,docx.__version__,pptx.__version__,pypdf.__version__)"
      - name: Reproduce all original no-clobber failures
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          paths=(
            agentuniverse/agent/action/tool/common_tool/file_path_utils.py
            agentuniverse/agent/action/tool/common_tool/word_document_tool.py
            agentuniverse/agent/action/tool/common_tool/powerpoint_tool.py
            agentuniverse/agent/action/tool/common_tool/pdf_tool.py
            agentuniverse/agent/action/tool/common_tool/email_document_tool.py
          )
          for path in "${paths[@]}"; do
            git show "93ac9e214ba626c7c8fea68f66bca239963ed3c9:$path" > "$path"
          done
          set +e
          python -m pytest -q -o addopts= -p no:cacheprovider --tb=short tests/test_agentuniverse/unit/agent/action/tool/test_document_create_race.py tests/test_agentuniverse/unit/agent/action/tool/test_document_output_race.py > baseline.log 2>&1
          result=$?
          set -e
          git restore --source=HEAD -- "${paths[@]}"
          cat baseline.log
          test "$result" -eq 1
          grep -F '9 failed, 18 passed' baseline.log
      - name: Validate complete standalone document tests
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          python -m pytest -q -rA -o addopts= -p no:cacheprovider --tb=short --junitxml=standalone.xml tests/test_agentuniverse/unit/agent/action/tool/test_document_create_race.py tests/test_agentuniverse/unit/agent/action/tool/test_document_output_race.py tests/test_agentuniverse/unit/agent/action/tool/test_atomic_file_publish.py tests/test_agentuniverse/unit/agent/action/tool/test_word_document_tool.py tests/test_agentuniverse/unit/agent/action/tool/test_powerpoint_tool.py tests/test_agentuniverse/unit/agent/action/tool/test_pdf_tool.py tests/test_agentuniverse/unit/agent/action/tool/test_email_document_tool.py
          python - <<'PY'
          import xml.etree.ElementTree as ET
          suites=ET.parse('standalone.xml').getroot().findall('.//testsuite')
          counts={k:sum(int(s.get(k,0)) for s in suites) for k in ['tests','failures','errors','skipped']}
          print(counts)
          assert counts=={'tests':124,'failures':0,'errors':0,'skipped':0},counts
          PY
      - name: Validate composition with the final3735 MIME repair
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          cp .ci/document-output/combined_email.py agentuniverse/agent/action/tool/common_tool/email_document_tool.py
          python -m pytest -q -rA -o addopts= -p no:cacheprovider --tb=short --junitxml=combined.xml tests/test_agentuniverse/unit/agent/action/tool/test_document_create_race.py tests/test_agentuniverse/unit/agent/action/tool/test_document_output_race.py tests/test_agentuniverse/unit/agent/action/tool/test_atomic_file_publish.py tests/test_agentuniverse/unit/agent/action/tool/test_word_document_tool.py tests/test_agentuniverse/unit/agent/action/tool/test_powerpoint_tool.py tests/test_agentuniverse/unit/agent/action/tool/test_pdf_tool.py tests/test_agentuniverse/unit/agent/action/tool/test_email_document_tool.py tests/test_agentuniverse/unit/agent/action/tool/test_email_attachment_boundaries.py
          python - <<'PY'
          import xml.etree.ElementTree as ET
          suites=ET.parse('combined.xml').getroot().findall('.//testsuite')
          counts={k:sum(int(s.get(k,0)) for s in suites) for k in ['tests','failures','errors','skipped']}
          print(counts)
          assert counts=={'tests':158,'failures':0,'errors':0,'skipped':0},counts
          PY
          git restore --source=HEAD -- agentuniverse/agent/action/tool/common_tool/email_document_tool.py
          git diff 93ac9e214ba626c7c8fea68f66bca239963ed3c9 HEAD^ --check
          git diff --exit-code HEAD -- agentuniverse tests
