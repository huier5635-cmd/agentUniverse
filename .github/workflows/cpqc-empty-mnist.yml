name: Verify MNIST QVAE empty test-set diagnostic
on:
  push:
    branches: [ci/cpqc-empty-mnist-test-20261115]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: qboson/kaiwu-pytorch-plugin
          ref: cbef8d86b297963326b92eeabd9d32be2a640c21
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install the CPU and example dependencies
        run: |
          python -m pip install torch==2.7.0 torchvision==0.22.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy==2.2.6' 'kaiwu==1.3.1' 'pytest==8.3.5' imageio torchmetrics pandas seaborn tqdm matplotlib scikit-learn
      - name: Check the red and green example regressions
        working-directory: source
        env:
          PYTHONPATH: src
        run: python ../payload/validate.py
