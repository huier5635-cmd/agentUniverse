name: Verify concurrent IvorySQL Oracle regressions
on:
  push:
    branches: [ci/ivorysql-oracle-3244-20261115]
permissions:
  contents: read
jobs:
  oracle-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: IvorySQL/IvorySQL
          ref: 475ab1956568da0e6e796902bf6e13a916396edd
          path: source
          persist-credentials: false
      - name: Set the test installation path
        run: echo "IVORY_PREFIX=$RUNNER_TEMP/ivory-prefix" >> "$GITHUB_ENV"
      - name: Install compiler dependencies
        run: sudo apt-get update && sudo apt-get install -y bison flex libreadline-dev zlib1g-dev uuid-dev libxml2-dev libcurl4-openssl-dev
      - name: Build the reported IvorySQL base
        working-directory: source
        run: |
          ./configure --prefix="$IVORY_PREFIX" --without-icu --with-uuid=e2fs --with-libxml
          make -j"$(nproc)" world-bin > "$RUNNER_TEMP/ivory-build.log" 2>&1 || { tail -n 120 "$RUNNER_TEMP/ivory-build.log"; exit 1; }
          make -j"$(nproc)" install-world-bin > "$RUNNER_TEMP/ivory-install.log" 2>&1 || { tail -n 120 "$RUNNER_TEMP/ivory-install.log"; exit 1; }
          make -j"$(nproc)" install >> "$RUNNER_TEMP/ivory-install.log" 2>&1 || { tail -n 120 "$RUNNER_TEMP/ivory-install.log"; exit 1; }
          make -C src/oracle_test/regress pg_regress
      - name: Reproduce and validate the concurrent runs
        working-directory: source
        run: python3 ../payload/validate.py
      - name: Run the installed PostgreSQL test suites
        working-directory: source
        run: |
          "$IVORY_PREFIX/bin/initdb" -D "$RUNNER_TEMP/ivory-pg" -m pg -C normal --auth trust --no-locale
          export PGHOST="$(mktemp -d)"
          export PGPORT=56928
          "$IVORY_PREFIX/bin/pg_ctl" -D "$RUNNER_TEMP/ivory-pg" -o "-p $PGPORT -k $PGHOST -c listen_addresses= -c max_prepared_transactions=2" -w start
          trap '"$IVORY_PREFIX/bin/pg_ctl" -D "$RUNNER_TEMP/ivory-pg" -m fast -w stop' EXIT
          make -j2 installcheck-world > "$RUNNER_TEMP/ivory-installcheck.log" 2>&1 || { tail -n 120 "$RUNNER_TEMP/ivory-installcheck.log"; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ivory-oracle-3244-evidence
          path: |
            evidence/
            ${{ runner.temp }}/ivory-build.log
            ${{ runner.temp }}/ivory-install.log
            ${{ runner.temp }}/ivory-installcheck.log
