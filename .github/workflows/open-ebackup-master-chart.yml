name: Verify MasterServer d10 gateway chart compatibility
on:
  push:
    branches: [ci/open-ebackup-master-chart-20261128]
permissions:
  contents: read
jobs:
  kind:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    env:
      PROPOSAL: 6d2b993619dba49d9d904c555db75de00a9bdbc2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch the exact PR guide and pinned Kubernetes tools
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/oe-master-chart" "$RUNNER_TEMP/oe-bin"
          cd "$RUNNER_TEMP/oe-master-chart"
          git init --quiet source
          git -C source fetch --no-tags --depth=1 --filter=blob:none https://gitcode.com/huier325/open-eBackup.git "$PROPOSAL"
          guide='doc/quick_guide/快速入门.md'
          test "$(git -C source rev-parse "$PROPOSAL:$guide")" = 18162b5c71a5e8e6a580eb9169c314fd275b1c39
          git -C source show "$PROPOSAL:$guide" > proposal.md
          grep -Fx '    kubectl apply -k traefik-helm-chart-27.0.2/traefik/crds' proposal.md
          BASE=96ecbf1228f9e8c8a9baedcc4722ea06f61ea74b
          git -C source remote add origin https://gitcode.com/eBackup/open-eBackup.git
          git -C source fetch --no-tags --depth=1 --filter=blob:none origin "$BASE"
          test "$(git -C source rev-parse FETCH_HEAD)" = "$BASE"
          git -C source sparse-checkout set src/DPAProduct/build/helm/databackup \
            src/ProtectManager/build/helm/protect-manager src/ProtectManager/component/PM_API_Gateway/IngressRoute \
            src/Infrastructure_OM/ci/build/helm src/Infrastructure_OM/ci/script
          git -C source checkout --quiet --detach "$BASE"
          python3 -m venv venv
          venv/bin/python -m pip install PyYAML==6.0.2
          curl --fail --silent --show-error --location --retry 3 \
            https://codeload.github.com/traefik/traefik-helm-chart/tar.gz/refs/tags/v27.0.2 -o chart.tar.gz
          printf '%s\n' '0ac8958c5d8218f181c39c766f708de29d1fe134f06e27105810b154823d1c0b  chart.tar.gz' | sha256sum --check
          tar -xzf chart.tar.gz
          cd "$RUNNER_TEMP/oe-bin"
          kind_release=https://github.com/kubernetes-sigs/kind/releases/download/v0.27.0
          curl --fail --silent --show-error --location --retry 3 "$kind_release/kind-linux-amd64" -o kind-linux-amd64
          curl --fail --silent --show-error --location --retry 3 "$kind_release/kind-linux-amd64.sha256sum" -o kind.sha256
          sha256sum --check kind.sha256
          mv kind-linux-amd64 kind
          kubectl_release=https://dl.k8s.io/release/v1.32.2/bin/linux/amd64
          curl --fail --silent --show-error --location --retry 3 "$kubectl_release/kubectl" -o kubectl
          curl --fail --silent --show-error --location --retry 3 "$kubectl_release/kubectl.sha256" -o kubectl.sha256
          printf '%s  kubectl\n' "$(cat kubectl.sha256)" | sha256sum --check
          curl --fail --silent --show-error --location --retry 3 \
            https://get.helm.sh/helm-v3.17.4-linux-amd64.tar.gz -o helm.tar.gz
          printf '%s\n' 'c91e3d7293849eff3b4dc4ea7994c338bcc92f914864d38b5789bab18a1d775d  helm.tar.gz' | sha256sum -c -
          tar -xzf helm.tar.gz linux-amd64/helm
          mv linux-amd64/helm helm
          chmod +x kind kubectl helm
          echo "$RUNNER_TEMP/oe-bin" >> "$GITHUB_PATH"
      - name: Check every real gateway manifest before and after Traefik CRDs
        shell: bash
        run: |
          root="$RUNNER_TEMP/oe-master-chart"
          bash validation/verify_chart.sh "$root"
