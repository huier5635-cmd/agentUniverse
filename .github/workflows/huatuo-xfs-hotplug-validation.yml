name: HUATUO XFS device lifecycle validation
on:
  push:
    branches: [ci/huatuo-xfs-hotplug-validation]
  workflow_dispatch:
permissions: {}
jobs:
  xfs-lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch exact official HUATUO source
        run: |
          set -euo pipefail
          git init huatuo
          git -C huatuo remote add origin https://github.com/ccfos/huatuo.git
          git -C huatuo -c http.version=HTTP/1.1 fetch --depth=1 origin bdcee2d10d872c9c693a87994cf1f63f9b4340dd
          git -C huatuo checkout --detach FETCH_HEAD
          test "$(git -C huatuo rev-parse HEAD)" = bdcee2d10d872c9c693a87994cf1f63f9b4340dd
          mkdir -p xfs-logs
      - name: Build the repository development image
        run: docker build --target devel --progress plain -t huatuo-xfs-validation -f huatuo/Dockerfile.devel huatuo
      - name: Record development image
        run: docker image inspect huatuo-xfs-validation > xfs-logs/image.json
      - name: Reproduce, fix, benchmark and run repository checks
        run: |
          docker run --rm --privileged \
            -v /dev:/dev \
            -v "$PWD/huatuo:/workspace" \
            -v "$PWD/.ci/huatuo-xfs-hotplug:/evidence:ro" \
            -v "$PWD/xfs-logs:/logs" \
            -w /workspace huatuo-xfs-validation sh /evidence/run-ci.sh
      - name: Show terminal evidence
        if: always()
        run: |
          find xfs-logs -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
          for file in xfs-logs/verified-results.json xfs-logs/cleanup.txt; do
            if test -f "$file"; then cat "$file"; fi
          done
          for file in xfs-logs/*.log; do
            echo "Log tail: $file"
            tail -30 "$file"
          done
          python3 - <<'PY'
          import json
          from pathlib import Path
          for path in sorted(Path('xfs-logs').glob('*.jsonl')):
              events = []
              for line in path.read_text().splitlines():
                  try:
                      event = json.loads(line)
                  except json.JSONDecodeError:
                      continue
                  if event.get('Action') == 'fail' or 'Error:' in event.get('Output', '') or 'Error Trace:' in event.get('Output', ''):
                      events.append(event)
              print(path.name, json.dumps(events[-30:]))
          for path in sorted(Path('xfs-logs').glob('*full-unit.log')):
              failures = [line for line in path.read_text().splitlines() if line.startswith('--- FAIL:') or line.startswith('FAIL\t')]
              print(path.name, json.dumps(failures))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: huatuo-xfs-hotplug-evidence
          path: xfs-logs/
          retention-days: 30
  native-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GOMAXPROCS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.3'
          cache: false
      - name: Fetch exact official HUATUO source
        run: |
          git init native-source
          git -C native-source remote add origin https://github.com/ccfos/huatuo.git
          git -C native-source -c http.version=HTTP/1.1 fetch --depth=1 origin bdcee2d10d872c9c693a87994cf1f63f9b4340dd
          git -C native-source checkout --detach FETCH_HEAD
      - name: Install native generation dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang-15 libbpf-dev capnproto libelf-dev zlib1g-dev libpcap-dev make pkg-config build-essential
          echo /usr/lib/llvm-15/bin >> "$GITHUB_PATH"
          go install github.com/vektra/mockery/v2@v2.53.6
          go install capnproto.org/go/capnp/v3/capnpc-go@v3.1.0-alpha.2
      - name: Compare complete native baseline and fixed unit suites
        run: |
          mkdir -p xfs-native-logs
          uname -a > xfs-native-logs/environment.txt
          id >> xfs-native-logs/environment.txt
          test -S /run/systemd/private
          python3 .ci/huatuo-xfs-hotplug/run-ci-native.py
      - name: Show native verification evidence
        if: always()
        run: |
          if test -f xfs-native-logs/verified-native-unit.json; then cat xfs-native-logs/verified-native-unit.json; fi
          for file in xfs-native-logs/*.log; do
            echo "Log tail: $file"
            tail -25 "$file"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: huatuo-xfs-native-units
          path: xfs-native-logs/
          retention-days: 30
