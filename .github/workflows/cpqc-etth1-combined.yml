name: Verify compatible CPQCTorchkit ETTh1 changes
on:
  push:
    branches: [ci/cpqc-etth1-combined-20261122]
permissions:
  contents: read

jobs:
  combined:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    env:
      BASE: cbef8d86b297963326b92eeabd9d32be2a640c21
      CUDA_VISIBLE_DEVICES: ''
      OMP_NUM_THREADS: '3'
      MKL_NUM_THREADS: '3'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: qboson/kaiwu-pytorch-plugin
          ref: cbef8d86b297963326b92eeabd9d32be2a640c21
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Combine the exact three contribution heads
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE"
          for entry in \
            '1985:4a37a0b72ed198906e0a0672b0370949e3990aae' \
            '1986:1980731897cb519d4d008225cc3fa1e3fc1c9953' \
            '1987:2f42739b483afa4a53cc61ec7f41cdd178874219'; do
            pr="${entry%%:*}"
            head="${entry#*:}"
            git fetch --no-tags --depth=2 origin "refs/pull/$pr/head"
            test "$(git rev-parse FETCH_HEAD)" = "$head"
            test "$(git rev-parse "$head^")" = "$BASE"
            git cherry-pick --no-commit "$head"
            printf '#%s applied at %s\n' "$pr" "$head"
          done
          git diff --cached --check
          printf 'Combined source tree: %s\n' "$(git write-tree)"
      - name: Install the upstream CI dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install torch==2.7.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements/devel.txt kaiwu==1.3.1 scikit-learn==1.7.2 scipy==1.14.1 tqdm==4.67.1
          pip install .
          python -m pip check
          python -I -c 'import sys; import kaiwu.torch_plugin as p; assert p.__file__.startswith(sys.prefix), p.__file__'
          python -I -c 'from importlib.metadata import version; print("pandas supplied by CI:", version("pandas"))'
      - name: Test training arguments and MSE reporting together
        run: python -m pytest -q tests/test_etth1_train_mse.py tests/test_etth1_training_limits.py
      - name: Run a complete ETTh1 training pass and forecast
        run: |
          set -euo pipefail
          dataset=example/qdeq/data/ETTh1.csv
          mkdir -p "$(dirname "$dataset")"
          curl --fail --location --retry 2 \
            https://raw.githubusercontent.com/zhouhaoyi/ETDataset/11ab373cf9c9f5be7698e219a5a170e1b1c8a930/ETT-small/ETTh1.csv \
            --output "$dataset"
          printf '%s  %s\n' f18de3ad269cef59bb07b5438d79bb3042d3be49bdeecf01c1cd6d29695ee066 "$dataset" | sha256sum -c -
          python example/qdeq/simple/simple_train_example.py --sampler anderson \
            --epochs 1 --max-train-batches 100 </dev/null | tee "$RUNNER_TEMP/train.log"
          test -s example/qdeq/checkpoints/simple_etth1.pt
          python example/qdeq/simple/simple_forecast_example.py --sampler anderson </dev/null | tee "$RUNNER_TEMP/forecast.log"
          trained="$(grep -E '^test mse [0-9]+\.[0-9]+' "$RUNNER_TEMP/train.log")"
          forecast="$(sed -n 's/^anderson: \(test mse .*\)$/\1/p' "$RUNNER_TEMP/forecast.log")"
          test -n "$trained" && test "$trained" = "$forecast"
