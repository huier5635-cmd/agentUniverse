name: AgentSight native macOS build and label checks
on:
  push:
    branches: [ci/sight-macos-metrics]
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '3'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RUSTUP_TOOLCHAIN: '1.89.0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: agentic-os-org/ANOLISA
          ref: 5351c892f2e89d6be799ebdbeea948c173d3d7c2
          path: official
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: official/src/agentsight
          shared-key: sight-local-label-macos
          cache-on-failure: true
      - name: Reproduce pristine main build failure and verify manifest-only repair
        run: python3 .ci/sight-macos-metrics/verify.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sight-macos-metrics-verified
          path: build-evidence/
          if-no-files-found: error
  labels:
    needs: build
    runs-on: macos-14
    timeout-minutes: 35
    env:
      CARGO_BUILD_JOBS: '3'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RUSTUP_TOOLCHAIN: '1.89.0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: agentic-os-org/ANOLISA
          ref: 5351c892f2e89d6be799ebdbeea948c173d3d7c2
          path: official
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: sight-macos-metrics-verified
          path: metrics-verified
      - uses: actions/download-artifact@v4
        with:
          name: sight-local-label-prepared
          path: prepared
          run-id: 39958395342
          github-token: ${{ github.token }}
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: official/src/agentsight
          shared-key: sight-local-label-macos
          cache-on-failure: true
      - name: Verify native label errors with the explicit build prerequisite
        run: python3 .ci/sight-macos-metrics/verify-labels.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sight-local-label-with-build-prerequisite
          path: evidence/
          if-no-files-found: error
