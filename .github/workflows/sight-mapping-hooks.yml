name: AgentSight mapping hook coverage

on:
  push:
    branches: [ci/sight-mapping-hooks-20261115]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: agentic-os-org/ANOLISA
          ref: fc3cf6930c8d9efef63618c7928d760f975e056a
          path: upstream
          persist-credentials: false
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential libbpf-dev libelf-dev elfutils libssl-dev zlib1g-dev pkg-config libclang-dev
          rustup toolchain install stable --profile minimal -c rustfmt -c clippy
      - name: Compare strict lint and test the revised coverage
        working-directory: upstream/src/agentsight
        run: |
          set +e
          rustfmt +stable --check --edition 2024 crates/ebpf-ifc-engine/src/lib.rs > "$RUNNER_TEMP/original-fmt.log" 2>&1
          original_fmt=$?
          cargo +stable clippy --locked -p ebpf-ifc-engine --all-targets -- -D warnings > "$RUNNER_TEMP/original-clippy.log" 2>&1
          baseline=$?
          set -e
          git -C ../.. apply --whitespace=nowarn ../candidate.patch
          git diff --check
          set +e
          rustfmt +stable --check --edition 2024 crates/ebpf-ifc-engine/src/lib.rs > "$RUNNER_TEMP/candidate-fmt.log" 2>&1
          candidate_fmt=$?
          set -e
          test "$original_fmt" -eq "$candidate_fmt"
          diff -u <(sed -E 's/:[0-9]+:$/::/' "$RUNNER_TEMP/original-fmt.log") <(sed -E 's/:[0-9]+:$/::/' "$RUNNER_TEMP/candidate-fmt.log")
          cargo +stable test --locked -p ebpf-ifc-engine
          set +e
          cargo +stable clippy --locked -p ebpf-ifc-engine --all-targets -- -D warnings > "$RUNNER_TEMP/candidate-clippy.log" 2>&1
          candidate=$?
          set -e
          test "$baseline" -eq "$candidate"
          diff -u <(grep '^error:' "$RUNNER_TEMP/original-clippy.log" | sort) <(grep '^error:' "$RUNNER_TEMP/candidate-clippy.log" | sort)
          grep '^error:' "$RUNNER_TEMP/candidate-clippy.log" || true
      - name: Validate upstream RPM source inventory
        working-directory: upstream
        run: bash src/agentsight/scripts/test-rpm-packaging.sh
