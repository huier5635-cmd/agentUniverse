name: AgentSec hardening summary regression

on:
  push:
    branches: [ci/sec-summary-window-20261025]

permissions:
  contents: read

jobs:
  summary:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: agentic-os-org/ANOLISA
          ref: d17f1190ff7c50a72ef8249e8333a2125b6d6055
          path: upstream
          persist-credentials: false
          sparse-checkout: |
            src/agent-sec-core
            .github
            specs
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.9.5
          python-version: 3.11.6
          enable-cache: true
          cache-dependency-glob: upstream/src/agent-sec-core/agent-sec-cli/uv.lock
      - name: Install locked Python runtime and development dependencies
        working-directory: upstream/src/agent-sec-core
        run: |
          uv sync --project agent-sec-cli --locked --no-install-project --group dev
          uv run --project agent-sec-cli --no-sync python -c 'import sys; assert sys.version_info[:3] == (3, 11, 6); print(sys.version)'
      - name: Prove the regression fails on unchanged production
        working-directory: upstream/src/agent-sec-core
        env:
          PYTHONPATH: agent-sec-cli/src
        run: |
          cp "$GITHUB_WORKSPACE/payload/test_summary_formatter_compliance.py" tests/unit-test/security_events/
          mkdir -p "$GITHUB_WORKSPACE/evidence"
          set +e
          uv run --project agent-sec-cli --no-sync python -m pytest tests/unit-test/security_events/test_summary_formatter_compliance.py -q --junitxml="$GITHUB_WORKSPACE/evidence/original.xml" > "$GITHUB_WORKSPACE/evidence/original.txt" 2>&1
          result=$?
          set -e
          cat "$GITHUB_WORKSPACE/evidence/original.txt"
          test "$result" -eq 1
          uv run --project agent-sec-cli --no-sync python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path
          suites = ET.parse(Path(os.environ['GITHUB_WORKSPACE']) / 'evidence/original.xml').getroot().findall('testsuite')
          counts = {key: sum(int(suite.get(key, 0)) for suite in suites) for key in ['tests', 'failures', 'errors', 'skipped']}
          assert counts == {'tests': 10, 'failures': 7, 'errors': 0, 'skipped': 0}, counts
          print(counts)
          PY
      - name: Validate fixed production and existing security-event cases
        working-directory: upstream/src/agent-sec-core
        env:
          PYTHONPATH: agent-sec-cli/src
        run: |
          cp "$GITHUB_WORKSPACE/payload/summary_formatter.py" agent-sec-cli/src/agent_sec_cli/security_events/summary_formatter.py
          uv run --project agent-sec-cli --no-sync python -m black --config agent-sec-cli/pyproject.toml --check agent-sec-cli/src/agent_sec_cli/security_events/summary_formatter.py tests/unit-test/security_events/test_summary_formatter_compliance.py
          uv run --project agent-sec-cli --no-sync python -m isort --settings-path agent-sec-cli/pyproject.toml --check-only agent-sec-cli/src/agent_sec_cli/security_events/summary_formatter.py tests/unit-test/security_events/test_summary_formatter_compliance.py
          uv run --project agent-sec-cli --no-sync python -m ruff check --config agent-sec-cli/pyproject.toml agent-sec-cli/src/agent_sec_cli/security_events/summary_formatter.py tests/unit-test/security_events/test_summary_formatter_compliance.py
          uv run --project agent-sec-cli --no-sync python -m pytest tests/unit-test/security_events/ -q --cov=agent_sec_cli.security_events.summary_formatter --cov-branch --cov-report=term-missing --cov-report=json:"$GITHUB_WORKSPACE/evidence/coverage.json" --junitxml="$GITHUB_WORKSPACE/evidence/fixed.xml" | tee "$GITHUB_WORKSPACE/evidence/fixed.txt"
          git diff --check
      - name: Upload exact validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sec-summary-window-evidence
          path: evidence/
          if-no-files-found: error
