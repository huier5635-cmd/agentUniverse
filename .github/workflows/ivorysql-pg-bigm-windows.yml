name: IvorySQL pg_bigm on Windows
on:
  push:
    branches:
      - ci/ivorysql-pg-bigm-windows

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install MSVC build prerequisites
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          choco install winflexbison3 -y --no-progress
          python -m pip install 'meson>=1.3,<2' ninja
      - name: Fetch the pinned native port and release sources
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          git -c core.longpaths=true init db
          git -C db config core.longpaths true
          git -C db fetch --depth=1 https://github.com/Muzzammil242/IvorySQL.git 7c1742cde16b699045c94fe053cc8798c1e093cd
          git -C db checkout --detach FETCH_HEAD
          $extension = 'db/contrib/pg_bigm'
          git init $extension
          git -C $extension fetch --depth=1 https://github.com/pgbigm/pg_bigm.git a372ba66e192bc2cdc9dfe6e482d167fecc9a1c2
          git -C $extension checkout --detach FETCH_HEAD
          if (Test-Path -LiteralPath "$extension/meson.build") { throw 'The pinned release unexpectedly contains a Meson build file' }
          Copy-Item -LiteralPath 'validation/pg_bigm/meson.build' -Destination "$extension/meson.build"
          Add-Content -LiteralPath 'db/contrib/meson.build' -Value "`nsubdir('pg_bigm')"
      - name: Build the native DLL and install
        shell: pwsh
        working-directory: db
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          meson setup build --vsenv --auto-features=disabled -Duuid=none -Dssl=none -Dbuildtype=release --prefix "$env:GITHUB_WORKSPACE/pg-install"
          meson compile -C build pg_bigm
          meson install -C build
          $bin = "$env:GITHUB_WORKSPACE/pg-install/bin"
          $extensionLibrary = Join-Path (& "$bin/pg_config.exe" --pkglibdir) 'pg_bigm.dll'
          Get-Item -LiteralPath $extensionLibrary | Select-Object Name,Length
      - name: Check bigram searches on both listeners
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $bin = "$env:GITHUB_WORKSPACE/pg-install/bin"
          $env:Path = "$bin;$env:Path"
          $cluster = "$env:RUNNER_TEMP/ivory-bigm"
          $log = "$env:RUNNER_TEMP/ivory-bigm.log"
          & "$bin/initdb.exe" -D $cluster -U postgres -A trust --encoding=UTF8 --no-locale
          & "$bin/pg_ctl.exe" -D $cluster -l $log -o "-p 55437 -h 127.0.0.1 -c ivorysql.port=55438 -c ivorysql.listen_addresses=127.0.0.1" -w start
          try {
            $common = @('-X', '-v', 'ON_ERROR_STOP=1', '-h', '127.0.0.1', '-U', 'postgres')
            & "$bin/psql.exe" @common -p 55437 -d postgres -c 'CREATE DATABASE bigm_pg;'
            & "$bin/psql.exe" @common -p 55437 -d postgres -c 'CREATE DATABASE bigm_ora;'
            $sql = @'
          CREATE EXTENSION pg_bigm;
          SELECT 'version=' || extversion FROM pg_catalog.pg_extension WHERE extname = 'pg_bigm';
          CREATE TABLE bigm_documents (id int, body text);
          INSERT INTO bigm_documents VALUES (1, '北京市'), (2, '上海市'), (3, '欢迎来到北京');
          CREATE INDEX bigm_documents_idx ON bigm_documents USING gin (body gin_bigm_ops);
          SET enable_seqscan = off;
          EXPLAIN (COSTS OFF) SELECT id FROM bigm_documents WHERE body LIKE '%北京%';
          SELECT 'match=' || id FROM bigm_documents WHERE body LIKE '%北京%' ORDER BY id;
          SELECT CASE WHEN bigm_similarity('北京市', '北京市') = 1 THEN 'similarity=ok' ELSE 'similarity=bad' END;
          '@
            $test = "$env:RUNNER_TEMP/pg-bigm.sql"
            Set-Content -LiteralPath $test -Value $sql -Encoding utf8NoBOM
            $env:PGCLIENTENCODING = 'UTF8'
            $targets = [ordered]@{ bigm_pg = 55437; bigm_ora = 55438 }
            foreach ($db in $targets.Keys) {
              Write-Output "Testing $db on port $($targets[$db])"
              $result = & "$bin/psql.exe" @common -p $targets[$db] -d $db -At -f $test
              $result | Write-Output
              $matchedRows = @($result | Where-Object { $_ -clike 'match=*' })
              if ('version=1.2' -cnotin $result -or 'similarity=ok' -cnotin $result -or
                  ($matchedRows -join ',') -cne 'match=1,match=3' -or
                  !($result -imatch 'Bitmap Index Scan on bigm_documents_idx')) {
                throw "Unexpected search result or query plan in $db"
              }
              Write-Output "${db}: verified indexed Chinese search and similarity."
            }
          } finally {
            & "$bin/pg_ctl.exe" -D $cluster -m fast -w stop
          }
      - name: Print the database log on failure
        if: failure()
        shell: pwsh
        run: |
          $log = "$env:RUNNER_TEMP/ivory-bigm.log"
          if (Test-Path -LiteralPath $log) { Get-Content -LiteralPath $log -Tail 100 }
