name: OpenCloudOS kernel validation feasibility
on:
  push:
    branches: [ci/opencloudos-stat-no-full-hz]
  workflow_dispatch:
permissions: {}
jobs:
  feasibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GIT_TERMINAL_PROMPT: '0'
    steps:
      - name: Inspect build and virtualization support
        run: |
          set -euo pipefail
          uname -m
          getconf _NPROCESSORS_ONLN
          df -Pk .
          for build_tool in gcc make flex bison bc ld objcopy cpio; do
            command -v "$build_tool" || true
          done
          if test -c /dev/kvm; then
            echo KVM_DEVICE_PRESENT=yes
            ls -l /dev/kvm
          else
            echo KVM_DEVICE_PRESENT=no
            exit 1
          fi
      - name: Verify real KVM initialization
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86
          printf 'info kvm\nquit\n' | sudo qemu-system-x86_64 \
            -machine q35,accel=kvm -cpu host -smp 2 -m 256 \
            -nodefaults -display none -serial none -monitor stdio -S
      - name: Resolve actual OpenCloudOS target branch
        run: |
          set -euo pipefail
          timeout 90s git ls-remote --exit-code --heads \
            https://gitee.com/OpenCloudOS/OpenCloudOS-Kernel.git \
            refs/heads/linux-6.6/devel
