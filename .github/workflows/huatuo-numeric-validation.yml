name: HUATUO standalone SQLite allocation reproduction
on:
  push:
    branches: [ci/huatuo-sqlite-manual-repro]
  workflow_dispatch:
permissions: {}
jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GOMAXPROCS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.3'
          cache: false
      - name: Prepare exact official source and standalone caller
        run: |
          set -euo pipefail
          git init huatuo
          git -C huatuo remote add origin https://github.com/ccfos/huatuo.git
          git -C huatuo fetch --depth=1 origin 07e184e7bf1af789e2b6aaf74b253acfb4ba6c46
          git -C huatuo checkout --detach FETCH_HEAD
          test "$(git -C huatuo hash-object internal/storage/sqlite/sqlite.go)" = 5d66dd3a9ddb3e4840a22a5f0e8bd0bb1dda961e
          mkdir -p huatuo/.repro/sqlite-cap
          cp .ci/huatuo-manual-repro.go huatuo/.repro/sqlite-cap/main.go
          gofmt -w huatuo/.repro/sqlite-cap/main.go
          go version
      - name: Compile real original backend and reproduce the two panics
        run: |
          set -euo pipefail
          (cd huatuo && go build -p=2 -mod=vendor -o ../sqlite-cap-original ./.repro/sqlite-cap)
          for operation in query values; do
            ./sqlite-cap-original "$operation" normal | tee "sqlite-manual-original-${operation}-normal.log"
            set +e
            ./sqlite-cap-original "$operation" max > "sqlite-manual-original-${operation}-max.log" 2>&1
            result=$?
            set -e
            test "$result" -eq 2
            grep -F 'panic: runtime error: makeslice: cap out of range' "sqlite-manual-original-${operation}-max.log"
          done
      - name: Compile exact PR production code and repeat the same caller
        run: |
          set -euo pipefail
          git -C huatuo apply --check ../.ci/huatuo-query-fix.patch
          git -C huatuo apply ../.ci/huatuo-query-fix.patch
          test "$(git -C huatuo hash-object internal/storage/sqlite/sqlite.go)" = 07ff02c5abd0626af45162a07a192f77b527c515
          (cd huatuo && go build -p=2 -mod=vendor -o ../sqlite-cap-fixed ./.repro/sqlite-cap)
          for operation in query values; do
            for bound in normal max; do
              ./sqlite-cap-fixed "$operation" "$bound" | tee "sqlite-manual-fixed-${operation}-${bound}.log"
              grep -F "$operation $bound: err=<nil>" "sqlite-manual-fixed-${operation}-${bound}.log"
            done
          done
      - name: Run existing SQLite tests without adding the allocation unit files
        working-directory: huatuo
        run: |
          set -euo pipefail
          test ! -e internal/storage/sqlite/values_allocation_test.go
          test ! -e internal/storage/sqlite/query_allocation_test.go
          go test -p=2 -mod=vendor -count=1 ./internal/storage/sqlite
          go test -p=2 -mod=vendor -race -count=1 ./internal/storage/sqlite
          go vet -p=2 -mod=vendor ./internal/storage/sqlite
          git diff --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sqlite-standalone-reproduction
          path: sqlite-manual-*.log
